# Builds an installable Android APK and publishes it two ways.
#
#   1. A rolling GitHub Release — the easy one, a permanent phone-friendly link:
#        https://github.com/<owner>/openGym/releases/latest
#        https://github.com/<owner>/openGym/releases/download/apk-latest/openGym-debug.apk
#   2. A workflow artifact on the run (openGym-debug-apk), for anyone signed in.
#
# It builds on every push to main and on demand from the Actions tab (Run workflow). The APK
# is debug-signed — fine for sideloading onto your own phone; it is not a Play Store release.
name: Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write   # needed to publish the APK to a Release

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # node:22-alpine in the Docker images — keep CI on the same major.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      # Gradle for the Capacitor Android project needs JDK 21 (see docs/MOBILE.md).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
      - run: npm ci
        working-directory: frontend
      # Bakes the CDN media base into the bundle and copies the web build into android/ + ios/.
      - run: npm run build:mobile
        working-directory: frontend
      - run: ./gradlew assembleDebug --no-daemon
        working-directory: frontend/android
      # A stable filename gives the Release a stable download URL across builds.
      - run: cp app/build/outputs/apk/debug/app-debug.apk openGym-debug.apk
        working-directory: frontend/android
      - uses: actions/upload-artifact@v4
        with:
          name: openGym-debug-apk
          path: frontend/android/openGym-debug.apk
          if-no-files-found: error
      # Replace the single rolling "apk-latest" release so the download link always points at
      # the newest build. Skipped on manual runs from a non-main branch.
      - name: Publish APK to the rolling Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest openGym-debug.apk \
            --title "openGym APK (latest build)" \
            --notes "Debug-signed APK built from the latest main. Download openGym-debug.apk below and sideload it onto your phone (allow installs from unknown sources once). Rebuilt on every push to main, so this release always holds the newest build." \
            --latest
        working-directory: frontend/android
